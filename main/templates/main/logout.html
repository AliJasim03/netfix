{% extends 'main/base.html' %} 
{% block title %}
    Logged Out - NetFix
{% endblock %}

{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/logout.css' %}">
{% endblock %}

{% block content %}
<div class="logout-container">
    <div class="logout-icon">
        <i class="fas fa-sign-out-alt fa-4x"></i>
    </div>
    <h1 class="logout-title">You've been logged out</h1>
    <p class="logout-message">Thank you for using NetFix. We hope to see you again soon!</p>

    <div class="logout-actions">
        <a href="{% url 'login_user' %}" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Log In Again
        </a>
        <a href="{% url 'main:home' %}" class="btn btn-outline">
            <i class="fas fa-home"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
